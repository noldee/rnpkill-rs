[package]
name = "rnpkill-rs"
version = "0.1.0"
edition = "2021"
authors = ["Walter"]
description = "Educational Rust reimplementation of rnpkill — clean your dev folders, fast."
license = "MIT"
repository = "https://github.com/noldee/rnpkill-rs"

[[bin]]
name = "rnpkill-rs"
path = "src/main.rs"

[dependencies]
walkdir = "2.5"
rayon = "1.10"
anyhow = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"