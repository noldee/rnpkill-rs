[package]
name = "rnpkill-rs"
version = "0.1.0"
edition = "2021"
authors = ["Walter"]
description = "Educational Rust reimplementation of rnpkill — clean your dev folders, fast."
license = "MIT"
repository = "https://github.com/noldee/rnpkill-rs"

[[bin]]
name = "rnpkill-rs"
path = "src/main.rs"

[dependencies]
walkdir = "2.5"
rayon = "1.10"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = "0.4"
directories = "5.0"
dirs = "7.0.0"
crossterm = "0.29.0"
self_update = { version = "0.41", features = ["archive-tar", "archive-zip", "compression-flate2"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
